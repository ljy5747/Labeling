<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>국균연구소 라벨 메이커</title>
<meta name="description" content="국균연구소 사슴벌레 사육 라벨을 입력하고 이미지로 저장합니다.">
<meta name="theme-color" content="#111111">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@500;700;900&family=Noto+Serif+KR:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#111; --paper:#fafaf7; --line:#d9d6cf; --muted:#7a766e;
    --gold:#9c7a3c; --warn:#b4472e; --field:#fff;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--paper); color:var(--ink);
    font-family:"Noto Serif KR", serif; font-weight:500;
    -webkit-text-size-adjust:100%;
  }
  header.top{
    background:var(--ink); color:#fff; padding:14px 16px;
    display:flex; align-items:baseline; gap:10px; justify-content:space-between;
  }
  header.top h1{margin:0; font-size:20px; font-weight:900; letter-spacing:.04em}
  header.top span{font-size:12px; color:#c9b68e; letter-spacing:.12em}

  .wrap{max-width:1280px; margin:0 auto; padding:16px;
    display:grid; grid-template-columns:minmax(0,1fr); gap:20px}
  @media (min-width:960px){
    .wrap{grid-template-columns:minmax(0,440px) minmax(0,1fr); align-items:start}
    .preview{order:2; position:sticky; top:16px}
    .form{order:1}
  }

  /* preview */
  .preview{background:var(--paper); z-index:5}
  @media (max-width:959px){
    .preview{position:sticky; top:0; margin:0 -16px; padding:10px 16px 12px;
      border-bottom:1px solid var(--line)}
    .preview.collapsed canvas{display:none}
  }
  .preview canvas{width:100%; height:auto; display:block; border-radius:6px;
    box-shadow:0 4px 18px rgba(0,0,0,.12)}
  .pbar{display:flex; gap:8px; margin-top:10px}
  .pbar button{flex:1}
  .langbar{display:flex;align-items:center;justify-content:flex-end;gap:8px;margin-top:10px;font-size:13px}
  .langbar select{font:inherit;border:1px solid var(--line);background:#fff;border-radius:7px;padding:7px 10px;color:var(--ink)}
  .toggle{display:none}
  @media (max-width:959px){ .toggle{display:inline-block; flex:0 0 auto} }

  button{
    font:inherit; font-weight:700; font-size:15px; border-radius:8px; cursor:pointer;
    padding:12px 14px; border:1px solid var(--ink); background:#fff; color:var(--ink);
  }
  button.primary{background:var(--ink); color:#fff}
  button.primary:active{background:#333}
  button.ghost{border-color:var(--line); color:var(--muted)}

  /* form */
  .card{background:#fff; border:1px solid var(--line); border-radius:10px; padding:16px; margin-bottom:16px}
  .card h2{margin:0 0 12px; font-size:15px; font-weight:900; letter-spacing:.06em;
    display:flex; align-items:center; gap:8px}
  .card h2::before{content:""; width:4px; height:15px; background:var(--gold); display:inline-block}
  .row{display:grid; gap:10px; margin-bottom:10px}
  .row:last-child{margin-bottom:0}
  .c2{grid-template-columns:1fr 1fr}
  .c3{grid-template-columns:1fr 1fr 1fr}
  .c-size{grid-template-columns:110px 1fr}
  label.f{display:flex; flex-direction:column; gap:4px; font-size:12px; color:var(--muted); min-width:0}
  input[type=text],input[type=date]{
    font:inherit; font-size:16px; color:var(--ink); background:var(--field);
    border:1px solid var(--line); border-radius:7px; padding:10px; width:100%; min-width:0;
    -webkit-appearance:none; appearance:none; min-height:44px;
  }
  input:focus{outline:2px solid var(--gold); outline-offset:-1px; border-color:var(--gold)}
  .unit{position:relative}
  .unit input{padding-right:40px}
  .unit::after{content:attr(data-u); position:absolute; right:11px; top:50%;
    transform:translateY(-50%); font-size:13px; color:var(--muted); pointer-events:none}

  .seg{display:flex; border:1px solid var(--ink); border-radius:8px; overflow:hidden}
  .seg button{flex:1; border:0; border-radius:0; padding:8px 0; font-size:22px; min-height:44px}
  .seg button+button{border-left:1px solid var(--ink)}
  .seg button.on{background:var(--ink); color:#fff}

  .feed{border-top:1px dashed var(--line); padding-top:12px; margin-top:12px}
  .feed:first-of-type{border-top:0; padding-top:0; margin-top:0}
  .feed .tag{font-weight:900; font-size:14px; margin-bottom:6px; display:flex; justify-content:space-between}
  .feed .tag button{padding:2px 8px; font-size:12px; border-color:var(--line); color:var(--muted); font-weight:500}
  .feed-grid{display:grid; grid-template-columns:1.3fr 1fr 1fr 1fr; gap:8px}
  @media (max-width:520px){ .feed-grid{grid-template-columns:1fr 1fr} }

  .warn{color:var(--warn); font-size:12px; margin-top:6px; display:none}
  .warn.show{display:block}
  .foot{display:flex; gap:10px}
  .foot button{flex:1}
  .note{font-size:12px; color:var(--muted); text-align:center; margin:4px 0 24px}

  /* BeetleLog 가져오기 */
  .import{width:100%; margin-bottom:16px; display:flex; align-items:center; justify-content:center; gap:8px;
    background:#fff; border:1px solid var(--gold); color:var(--ink)}
  .import b{color:var(--gold)}
  .sheet-bg{position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:50; display:none}
  .sheet-bg.open{display:block}
  .sheet{position:fixed; left:0; right:0; bottom:0; max-height:86vh; background:var(--paper);
    border-radius:16px 16px 0 0; z-index:51; display:none; flex-direction:column;
    padding:14px 16px calc(16px + env(safe-area-inset-bottom))}
  .sheet.open{display:flex}
  @media (min-width:700px){ .sheet{left:50%; right:auto; width:560px; transform:translateX(-50%); bottom:auto; top:6vh; border-radius:14px} }
  .sheet-head{display:flex; align-items:center; gap:10px; margin-bottom:10px}
  .sheet-head h3{margin:0; font-size:17px; font-weight:900; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .sheet-head button{padding:6px 12px; font-size:13px}
  .sheet-sub{font-size:12px; color:var(--muted); margin-bottom:10px; display:flex; justify-content:space-between; gap:8px}
  .sheet-sub a{color:var(--muted)}
  .sheet input[type=search]{font:inherit; font-size:16px; width:100%; padding:10px; border:1px solid var(--line);
    border-radius:8px; margin-bottom:10px; -webkit-appearance:none; appearance:none; background:#fff}
  .sheet-list{overflow:auto; -webkit-overflow-scrolling:touch; flex:1; min-height:120px}
  .item{display:block; width:100%; text-align:left; border:1px solid var(--line); background:#fff; border-radius:10px;
    padding:12px; margin-bottom:8px; font-weight:500}
  .item:active{background:#f3efe6}
  .item .t{font-weight:900; font-size:15px; display:flex; gap:6px; align-items:center; flex-wrap:wrap}
  .item .s{font-size:12px; color:var(--muted); margin-top:3px}
  .chip{font-size:11px; border:1px solid var(--line); border-radius:20px; padding:1px 7px; font-weight:700}
  .chip.m{color:#2d5d9f; border-color:#2d5d9f55} .chip.f{color:#b0405e; border-color:#b0405e55}
  .msg{text-align:center; color:var(--muted); font-size:14px; padding:28px 8px; line-height:1.6}
  .msg button{margin-top:14px}
</style>
</head>
<body>
<header class="top"><h1>國菌研究所 라벨</h1><span>LABEL MAKER</span></header>

<main class="wrap">
  <section class="preview" id="preview">
    <canvas id="cv" width="1444" height="1032" aria-label="라벨 미리보기"></canvas>
    <div class="langbar"><label for="labelLang">출력 라벨 언어</label><select id="labelLang" aria-label="출력 라벨 언어"><option value="ko">한국어</option><option value="ja">日本語</option></select></div>
    <div class="pbar">
      <button class="primary" id="saveBtn">이미지 저장</button>
      <button class="toggle ghost" id="toggleBtn">접기</button>
    </div>
  </section>

  <section class="form">
    <button type="button" class="import" id="importBtn"><b>🪲</b> BeetleLog에서 가져오기</button>
    <div class="card">
      <h2>기본 정보</h2>
      <div class="row c2">
        <label class="f">No.
          <input type="text" id="no" inputmode="numeric" autocomplete="off" placeholder="13">
        </label>
        <div class="f"><span style="font-size:12px;color:var(--muted)">성별</span>
          <div class="seg" id="sexSeg">
            <button type="button" data-v="m">♂</button>
            <button type="button" data-v="f">♀</button>
          </div>
        </div>
      </div>
    </div>

    <div class="card">
      <h2>종충</h2>
      <div class="row c2">
        <label class="f">라인명 <input type="text" id="line" autocomplete="off" placeholder="꿀동 A"></label>
        <label class="f">누대수 <input type="text" id="gen" list="genList" autocomplete="off" placeholder="CBF1"></label>
      </div>
      <div class="row c-size">
        <label class="f">♂ 크기 <span class="unit" data-u="mm"><input type="text" id="mSize" inputmode="decimal" placeholder="86.7"></span></label>
        <label class="f">♂ 혈통 <input type="text" id="mLine" autocomplete="off" placeholder="한테란 H-1"></label>
      </div>
      <div class="row c-size">
        <label class="f">♀ 크기 <span class="unit" data-u="mm"><input type="text" id="fSize" inputmode="decimal" placeholder="56.7"></span></label>
        <label class="f">♀ 혈통 <input type="text" id="fLine" autocomplete="off" placeholder="포에버 S563"></label>
      </div>
    </div>

    <div class="card">
      <h2>Breeding Data</h2>
      <div class="row c2">
        <label class="f">푸딩 날짜 <input type="date" id="pudDate"></label>
        <label class="f">푸딩 먹이원 <input type="text" id="pudFeed" list="feedList" autocomplete="off" placeholder="발효톱밥"></label>
      </div>
      <div class="row c2">
        <label class="f">두폭 <span class="unit" data-u="mm"><input type="text" id="head" inputmode="decimal" placeholder="14.1"></span></label>
      </div>
      <div id="feeds"></div>
      <div class="warn" id="dateWarn">날짜 순서가 맞지 않아요. 푸딩 → 교체 → 용화 → 우화 순서보다 이른 날짜가 있습니다.</div>
    </div>

    <div class="card">
      <h2>용화 · 우화</h2>
      <div class="row c2">
        <label class="f">용화 날짜 <input type="date" id="pupaDate"></label>
        <label class="f">용화 체중 <span class="unit" data-u="g"><input type="text" id="pupaW" inputmode="decimal" placeholder="30.2"></span></label>
      </div>
      <div class="row c2">
        <label class="f">우화 날짜 <input type="date" id="adultDate"></label>
        <label class="f">우화 크기 <span class="unit" data-u="mm"><input type="text" id="adult" inputmode="decimal" placeholder="90.5"></span></label>
      </div>
    </div>

    <div class="card">
      <h2>Breeder</h2>
      <label class="f">브리더 <input type="text" id="breeder" autocomplete="nickname" placeholder="피눈물"></label>
    </div>

    <div class="foot">
      <button class="ghost" id="resetBtn">전체 초기화</button>
      <button class="primary" id="saveBtn2">이미지 저장</button>
    </div>
    <p class="note">입력 내용은 이 기기에 자동 저장됩니다.</p>
  </section>
</main>

<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="sheet-head">
    <button type="button" class="ghost" id="sheetBack" hidden>‹ 라인</button>
    <h3 id="sheetTitle">BeetleLog에서 가져오기</h3>
    <button type="button" class="ghost" id="sheetClose">닫기</button>
  </div>
  <div class="sheet-sub" id="sheetSub" hidden><span id="whoami"></span><a href="#" id="logoutLink">로그아웃</a></div>
  <input type="search" id="sheetSearch" placeholder="검색" hidden>
  <div class="sheet-list" id="sheetList"></div>
</div>

<datalist id="genList">
  <option value="WD"><option value="WF1"><option value="WF2"><option value="CB">
  <option value="CBF1"><option value="CBF2"><option value="CBF3">
</datalist>
<datalist id="feedList">
  <option value="S8K"><option value="균사"><option value="발효톱밥">
</datalist>
<datalist id="volList">
  <option value="500CC"><option value="800CC"><option value="1100CC"><option value="1500CC"><option value="2300CC"><option value="3000CC">
</datalist>

<script>
(() => {
  const STORE = 'kgl-label-v1';
  const ORD = ['1st','2nd','3rd','4th','5th'];
  const SERIF = '"Noto Serif KR", serif';
  const JP_SERIF = '"Noto Serif JP", serif';
  const LANG_STORE = 'kgl-label-language';
  let labelLang = localStorage.getItem(LANG_STORE) === 'ja' ? 'ja' : 'ko';
  $('labelLang').value = labelLang;
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  const tpl = new Image();
  tpl.src = 'template.png';

  const $ = id => document.getElementById(id);
  const textIds = ['no','line','gen','mSize','mLine','fSize','fLine','pudDate','pudFeed','head','pupaDate','pupaW','adultDate','adult','breeder'];

  // 교체 기록 1st~5th 입력칸 생성
  const feedsEl = $('feeds');
  ORD.forEach((o, i) => {
    const d = document.createElement('div');
    d.className = 'feed';
    d.innerHTML = `
      <div class="tag">${o}<button type="button" data-clear="${i}">비우기</button></div>
      <div class="feed-grid">
        <label class="f">날짜 <input type="date" id="fd${i}"></label>
        <label class="f">먹이 <input type="text" id="ff${i}" list="feedList" autocomplete="off" placeholder="S8K"></label>
        <label class="f">용량 <input type="text" id="fv${i}" list="volList" autocomplete="off" placeholder="1500CC"></label>
        <label class="f">체중 <span class="unit" data-u="g"><input type="text" id="fw${i}" inputmode="decimal" placeholder="${i===0?'':'29.2'}"></span></label>
      </div>`;
    feedsEl.appendChild(d);
    textIds.push(`fd${i}`,`ff${i}`,`fv${i}`,`fw${i}`);
  });

  const state = { sex:'' };

  // ---------- 상태 저장/불러오기 ----------
  function collect(){
    const o = { sex:state.sex };
    textIds.forEach(id => o[id] = $(id).value);
    return o;
  }
  function save(){ try{ localStorage.setItem(STORE, JSON.stringify(collect())); }catch(e){} }
  function load(){
    let o = null;
    try{ o = JSON.parse(localStorage.getItem(STORE) || 'null'); }catch(e){}
    if(!o) return;
    textIds.forEach(id => { if(o[id] != null) $(id).value = o[id]; });
    state.sex = o.sex || '';
  }

  // ---------- 세그먼트 버튼 ----------
  function bindSeg(el, key){
    el.addEventListener('click', e => {
      const b = e.target.closest('button'); if(!b) return;
      state[key] = state[key] === b.dataset.v ? '' : b.dataset.v;
      update();
    });
  }
  function paintSeg(el, v){
    el.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.v === v));
  }
  bindSeg($('sexSeg'), 'sex');

  // ---------- 포맷 ----------
  const yymmdd = v => {
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(v || '');
    return m ? `${m[1].slice(2)}.${m[2]}.${m[3]}` : '';
  };
  const withUnit = (v, u) => (v = (v||'').trim()) ? `${v} ${u}` : '';
  const join = arr => arr.filter(Boolean).join('   ');

  // ---------- 캔버스 그리기 ----------
  function fitFont(text, maxW, size, weight){
    let s = size;
    ctx.font = `${weight} ${s}px ${SERIF}`;
    while(ctx.measureText(text).width > maxW && s > 14){
      s -= 1; ctx.font = `${weight} ${s}px ${SERIF}`;
    }
    return s;
  }
  // 셀 가운데 정렬 (x0~x1, y0~y1)
  function cell(text, x0, y0, x1, y1, size=34, weight=700){
    if(!text) return;
    fitFont(text, (x1 - x0) - 24, size, weight);
    ctx.fillStyle = '#000';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(text, (x0 + x1) / 2, (y0 + y1) / 2 + 2);
  }

  // 원본 템플릿을 보존한 채 인쇄 문구만 교체한다.
  function drawFixedLabels(){
    // 학명 아래의 희미한 밑줄 제거 (두 언어 공통)
    ctx.fillStyle = '#000';
    ctx.fillRect(814, 228, 265, 13);
    if(labelLang !== 'ja') return;
    function replaceCell(text, x0, y0, x1, y1, size=35){
      ctx.fillStyle = '#fff';
      ctx.fillRect(x0+3, y0+3, x1-x0-6, y1-y0-6);
      ctx.fillStyle = '#000';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.font = `900 ${size}px ${JP_SERIF}`;
      ctx.fillText(text, (x0+x1)/2, (y0+y1)/2+2, x1-x0-12);
    }
    replaceCell('ライン名', 123, 281, 266, 332, 30);
    replaceCell('累代', 760, 281, 896, 332);
    replaceCell('プリンカップ', 34, 518, 186, 565, 24);
    replaceCell('頭幅', 760, 518, 1006, 565);
    replaceCell('蛹化', 34, 804, 186, 854);
    replaceCell('羽化', 760, 804, 1006, 854);
    // 검은 세로 종충 칸
    ctx.fillStyle = '#000';
    ctx.fillRect(34, 282, 87, 167);
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = `900 43px ${JP_SERIF}`;
    ctx.fillText('種', 75, 342);
    ctx.fillText('親', 75, 405);
  }

  function draw(d){
    ctx.clearRect(0, 0, cv.width, cv.height);
    if(tpl.complete && tpl.naturalWidth) ctx.drawImage(tpl, 0, 0, cv.width, cv.height);
    drawFixedLabels();


    // No.
    if(d.no) cell(d.no.trim(), 1246, 82, 1406, 134, 40, 700);

    // 성별 체크
    // 체크 표시: 글자 실제 외곽 기준으로 칸 정중앙에 배치
    const checkAt = (cx, cy) => {
      ctx.font = `700 34px ${SERIF}`;
      ctx.fillStyle = '#000'; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
      const m = ctx.measureText('V');
      const w = m.actualBoundingBoxLeft + m.actualBoundingBoxRight;
      const h = m.actualBoundingBoxAscent + m.actualBoundingBoxDescent;
      ctx.fillText('V', cx - w / 2 + m.actualBoundingBoxLeft, cy - h / 2 + m.actualBoundingBoxAscent);
    };
    if(state.sex === 'm') checkAt(1222.5, 193.5);
    if(state.sex === 'f') checkAt(1371.5, 193.5);

    // 종충
    cell(d.line, 269, 283, 758, 331);
    cell(d.gen, 897, 283, 1412, 331);
    cell(withUnit(d.mSize, 'mm'), 269, 334, 477, 388);
    cell(d.mLine, 480, 334, 1412, 388);
    cell(withUnit(d.fSize, 'mm'), 269, 391, 477, 449);
    cell(d.fLine, 480, 391, 1412, 449);

    // Breeding Data
    cell(join([yymmdd(d.pudDate), d.pudFeed.trim()]), 188, 518, 758, 563);
    cell(withUnit(d.head, 'mm'), 1007, 518, 1412, 563);
    const rows = [[566,609],[612,656],[659,705],[708,754],[756,803]];
    // 1st~5th: 왼쪽 정렬 + 항목별 열 맞춤 (날짜 / 먹이 / 용량 / 체중)
    const feedCols = rows.map((_, i) => [yymmdd(d[`fd${i}`]), d[`ff${i}`].trim(), d[`fv${i}`].trim(), withUnit(d[`fw${i}`], 'g')]);
    const PAD = 56, GAP = 44, X0 = 188, X1 = 1412;
    let fs = 34, colW;
    const measureCols = () => {
      ctx.font = `700 ${fs}px ${SERIF}`;
      colW = [0,1,2,3].map(c => Math.max(0, ...feedCols.map(r => r[c] ? ctx.measureText(r[c]).width : 0)));
      const used = colW.filter(w => w > 0);
      return used.reduce((a, b) => a + b, 0) + GAP * Math.max(0, used.length - 1);
    };
    while(measureCols() > (X1 - X0) - PAD * 2 && fs > 16) fs--;
    ctx.fillStyle = '#000'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    rows.forEach(([y0,y1], i) => {
      let x = X0 + PAD;
      feedCols[i].forEach((t, c) => {
        if(!colW[c]) return;
        if(t) ctx.fillText(t, x, (y0 + y1) / 2 + 2);
        x += colW[c] + GAP;
      });
    });
    cell(join([yymmdd(d.pupaDate), withUnit(d.pupaW, 'g')]), 188, 806, 758, 854);
    cell(join([yymmdd(d.adultDate), withUnit(d.adult, 'mm')]), 1007, 806, 1412, 854);

    // Breeder
    if(d.breeder) cell(d.breeder.trim(), 250, 880, 1192, 936, 40, 700);
  }

  function checkDates(d){
    const ds = [d.pudDate].concat([0,1,2,3,4].map(i => d[`fd${i}`]), [d.pupaDate, d.adultDate]).filter(Boolean);
    let bad = false;
    for(let i = 1; i < ds.length; i++) if(ds[i] < ds[i-1]) bad = true;
    $('dateWarn').classList.toggle('show', bad);
  }

  // 필요한 글자의 웹폰트 조각을 먼저 받아온 뒤 다시 그림
  let fontSeq = 0;
  function ensureFonts(d){
    const text = Object.values(d).join('') + '0123456789.mmgCCVOX ';
    const seq = ++fontSeq;
    Promise.all([
      document.fonts.load(`700 34px ${SERIF}`, text),
      document.fonts.load(`700 46px ${SERIF}`, text),
      ...(labelLang === 'ja' ? [document.fonts.load(`900 35px ${JP_SERIF}`, '種親ライン名累代プリンカップ頭幅蛹化羽化')] : []),
    ]).then(() => { if(seq === fontSeq) draw(collect()); }).catch(() => {});
  }

  function update(){
    paintSeg($('sexSeg'), state.sex);
    const d = collect();
    draw(d);
    checkDates(d);
    save();
    ensureFonts(d);
  }

  document.addEventListener('input', e => { if(e.target.matches('input')) update(); });
  $('labelLang').addEventListener('change', e => {
    labelLang = e.target.value === 'ja' ? 'ja' : 'ko';
    localStorage.setItem(LANG_STORE, labelLang);
    update();
  });
  feedsEl.addEventListener('click', e => {
    const b = e.target.closest('[data-clear]'); if(!b) return;
    const i = b.dataset.clear;
    ['fd','ff','fv','fw'].forEach(p => $(p + i).value = '');
    update();
  });

  $('resetBtn').addEventListener('click', () => {
    if(!confirm('입력한 내용을 모두 지울까요?')) return;
    textIds.forEach(id => $(id).value = '');
    state.sex = '';
    update();
  });

  $('toggleBtn').addEventListener('click', () => {
    const p = $('preview');
    p.classList.toggle('collapsed');
    $('toggleBtn').textContent = p.classList.contains('collapsed') ? '펼치기' : '접기';
  });

  // ---------- 이미지 저장 ----------
  function fileName(){
    const d = collect();
    const parts = ['KGL', labelLang === 'ja' ? 'JP' : '', (d.line || '').trim(), d.no ? `No${d.no.trim()}` : ''].filter(Boolean);
    return parts.join('_').replace(/[\\/:*?"<>|\s]+/g, '_') + '.png';
  }
  async function saveImage(){
    const d = collect();
    try{ await Promise.all([document.fonts.load(`700 34px ${SERIF}`, Object.values(d).join('')),
                            document.fonts.load(`700 46px ${SERIF}`, Object.values(d).join('')),
                            ...(labelLang === 'ja' ? [document.fonts.load(`900 35px ${JP_SERIF}`, '種親ライン名累代プリンカップ頭幅蛹化羽化')] : [])]); }catch(e){}
    draw(d);
    const blob = await new Promise(r => cv.toBlob(r, 'image/png'));
    if(!blob) return alert('이미지를 만들지 못했어요. 다시 시도해 주세요.');
    const name = fileName();
    const file = new File([blob], name, { type:'image/png' });
    const mobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) ||
                   (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    if(mobile && navigator.canShare && navigator.canShare({ files:[file] })){
      try{ await navigator.share({ files:[file], title:name }); return; }
      catch(e){ if(e.name === 'AbortError') return; }
    }
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  }
  $('saveBtn').addEventListener('click', saveImage);
  $('saveBtn2').addEventListener('click', saveImage);

  // ================= BeetleLog 가져오기 =================
  const SB_URL = 'https://qybgsztoegkzqsdipili.supabase.co';
  const SB_KEY = 'sb_publishable_IwNmQESmOgj-DHR0sxOIlw_4EKsa4wu';
  const AUTH_STORE = 'kgl-label-auth';
  const homeUrl = () => location.origin + location.pathname.replace(/index\.html$/, '');
  const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  let bl = null;          // 불러온 BeetleLog 데이터
  let blEmail = '';
  let view = 'lines';     // lines | inds
  let curLine = null;

  const getSession = () => { try{ return JSON.parse(localStorage.getItem(AUTH_STORE) || 'null'); }catch(e){ return null; } };
  const setSession = s => { try{ s ? localStorage.setItem(AUTH_STORE, JSON.stringify(s)) : localStorage.removeItem(AUTH_STORE); }catch(e){} };

  // 구글 로그인 후 돌아오면 주소의 토큰을 저장하고 주소 정리
  function handleRedirect(){
    const h = location.hash || '';
    if(!h.includes('access_token')) return false;
    const p = new URLSearchParams(h.slice(1));
    const access = p.get('access_token');
    if(!access) return false;
    setSession({ access, refresh: p.get('refresh_token') || '', at: Date.now() });
    history.replaceState(null, '', homeUrl());
    return true;
  }
  function login(){
    location.href = `${SB_URL}/auth/v1/authorize?provider=google&redirect_to=${encodeURIComponent(homeUrl())}`;
  }
  async function refresh(s){
    if(!s || !s.refresh) return null;
    try{
      const r = await fetch(`${SB_URL}/auth/v1/token?grant_type=refresh_token`, {
        method:'POST', headers:{ apikey:SB_KEY, 'Content-Type':'application/json' },
        body: JSON.stringify({ refresh_token: s.refresh }) });
      if(!r.ok) return null;
      const j = await r.json();
      if(!j.access_token) return null;
      const n = { access:j.access_token, refresh:j.refresh_token || s.refresh, at:Date.now() };
      setSession(n); return n;
    }catch(e){ return null; }
  }
  async function validSession(){
    let s = getSession();
    if(!s) return null;
    if(!s.at || Date.now() - s.at > 50*60*1000) s = await refresh(s) || s;
    return s;
  }
  async function authed(url, s){
    let r = await fetch(url, { headers:{ apikey:SB_KEY, Authorization:`Bearer ${s.access}` } });
    if(r.status === 401){
      const n = await refresh(s);
      if(!n) throw Object.assign(new Error('login'), { login:true });
      r = await fetch(url, { headers:{ apikey:SB_KEY, Authorization:`Bearer ${n.access}` } });
    }
    if(r.status === 401) throw Object.assign(new Error('login'), { login:true });
    if(!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  }
  async function fetchBeetleLog(){
    const s = await validSession();
    if(!s) throw Object.assign(new Error('login'), { login:true });
    const u = await authed(`${SB_URL}/auth/v1/user`, s);
    if(!u || !u.email) throw Object.assign(new Error('login'), { login:true });
    blEmail = u.email;
    const s2 = getSession();
    const rows = await authed(`${SB_URL}/rest/v1/beetlelog_data?user_key=eq.${encodeURIComponent('user:' + u.email)}` +
      `&select=lines:data->lines,individuals:data->individuals,parents:data->parents`, s2);
    const d = rows[0] || {};
    return { lines: d.lines || [], individuals: d.individuals || [], parents: d.parents || [] };
  }

  // ---- 시트 UI ----
  const sheet = $('sheet'), sheetBg = $('sheetBg'), list = $('sheetList'), search = $('sheetSearch');
  function openSheet(){ sheet.classList.add('open'); sheetBg.classList.add('open'); document.body.style.overflow = 'hidden'; }
  function closeSheet(){ sheet.classList.remove('open'); sheetBg.classList.remove('open'); document.body.style.overflow = ''; }
  function msg(html){ list.innerHTML = `<div class="msg">${html}</div>`; }
  function chrome(title, showBack, showSearch){
    $('sheetTitle').textContent = title;
    $('sheetBack').hidden = !showBack;
    search.hidden = !showSearch;
    $('sheetSub').hidden = !blEmail;
    $('whoami').textContent = blEmail;
  }

  async function startImport(){
    openSheet();
    chrome('BeetleLog에서 가져오기', false, false);
    if(bl){ showLines(); return; }
    msg('불러오는 중…');
    try{
      bl = await fetchBeetleLog();
      showLines();
    }catch(e){
      if(e.login){
        setSession(null); blEmail = ''; chrome('BeetleLog에서 가져오기', false, false);
        msg('BeetleLog에서 쓰는 구글 계정으로 로그인하면<br>라인과 유충 기록을 바로 불러올 수 있어요.<br><button class="primary" id="loginBtn">구글로 로그인</button>');
        $('loginBtn').onclick = login;
      }else{
        msg('불러오지 못했어요. 잠시 후 다시 시도해 주세요.<br><button id="retryBtn">다시 시도</button>');
        $('retryBtn').onclick = () => { bl = null; startImport(); };
      }
    }
  }

  const parentsById = () => Object.fromEntries((bl.parents || []).map(p => [p.id, p]));
  const sexOf = v => /♂|수컷/.test(v || '') ? 'm' : /♀|암컷/.test(v || '') ? 'f' : '';
  const isPud = r => !!(r && (r.pudding || /푸딩/.test(String(r.bottleSize || ''))));
  const byDate = (a, b) => String(a.date || '').localeCompare(String(b.date || ''));

  function showLines(){
    view = 'lines'; curLine = null;
    chrome('라인 선택', false, true);
    search.placeholder = '라인명, 종, 누대 검색';
    const q = search.value.trim().toLowerCase();
    const counts = {};
    (bl.individuals || []).forEach(i => counts[i.lineId] = (counts[i.lineId] || 0) + 1);
    const lines = (bl.lines || []).filter(l => counts[l.id])
      .filter(l => !q || [l.code, l.species, l.gen, l.origin].join(' ').toLowerCase().includes(q))
      .sort((a, b) => String(b.setDate || b.year || '').localeCompare(String(a.setDate || a.year || '')) || String(a.code).localeCompare(String(b.code)));
    if(!lines.length){ msg(q ? '검색 결과가 없어요.' : '유충이 등록된 라인이 없어요.'); return; }
    list.innerHTML = lines.map(l => `
      <button class="item" data-line="${esc(l.id)}">
        <div class="t">${esc(l.code || '(이름 없음)')}${l.gen ? `<span class="chip">${esc(l.gen)}</span>` : ''}</div>
        <div class="s">${esc([l.species, l.origin].filter(Boolean).join(' · '))} · 유충 ${counts[l.id]}마리</div>
      </button>`).join('');
  }

  function showInds(lineId){
    view = 'inds'; curLine = (bl.lines || []).find(l => l.id === lineId) || curLine;
    chrome(curLine ? curLine.code : '유충 선택', true, true);
    search.placeholder = '개체 번호 검색';
    const q = search.value.trim().toLowerCase();
    const inds = (bl.individuals || []).filter(i => i.lineId === curLine.id)
      .filter(i => !q || String(i.code || '').toLowerCase().includes(q))
      .sort((a, b) => String(a.code || '').localeCompare(String(b.code || ''), 'ko', { numeric:true }));
    if(!inds.length){ msg('검색 결과가 없어요.'); return; }
    list.innerHTML = inds.map(i => {
      const recs = (i.bottleRecords || []).slice().sort(byDate);
      const last = [...recs].reverse().find(r => r.weight);
      const sx = sexOf(i.sex);
      const info = [
        last ? `최근 ${esc(last.weight)}g` : '',
        recs.filter(r => !isPud(r)).length ? `${recs.filter(r => !isPud(r)).length}병` : '',
        i.eclosion && i.eclosion.totalLength ? `우화 ${esc(i.eclosion.totalLength)}mm` : (i.pupation && i.pupation.pupaDate ? '용화' : ''),
        i.status || '',
      ].filter(Boolean).join(' · ');
      return `<button class="item" data-ind="${esc(i.id)}">
        <div class="t">${esc(i.code || '(번호 없음)')}${sx ? `<span class="chip ${sx}">${sx === 'm' ? '♂' : '♀'}</span>` : ''}</div>
        <div class="s">${info || '기록 없음'}</div>
      </button>`;
    }).join('');
  }

  function fillFrom(ind){
    const line = (bl.lines || []).find(l => l.id === ind.lineId) || {};
    const P = parentsById();
    const fa = P[line.fatherId] || {}, mo = P[line.motherId] || {};
    const lineage = p => [p.line, p.code].filter(Boolean).join(' ');
    const recs = (ind.bottleRecords || []).slice().sort(byDate);
    const pud = recs.find(isPud);
    const bottles = recs.filter(r => !isPud(r)).slice(0, 5);
    const feedOf = r => (r.feedBrand || r.feedType || '').trim();
    const ccOf = v => { const s = String(v || '').trim(); return !s ? '' : /^\d+(\.\d+)?$/.test(s) ? s + 'CC' : s.replace(/cc$/i, 'CC'); };
    const head = [...recs].reverse().find(r => String(r.headWidth || '').trim());
    const pu = ind.pupation || {}, ec = ind.eclosion || {};
    const v = {
      no: ind.code || '', line: line.code || '', gen: line.gen || '',
      mSize: fa.totalLength || '', mLine: lineage(fa),
      fSize: mo.totalLength || '', fLine: lineage(mo),
      pudDate: pud ? pud.date || '' : '', pudFeed: pud ? feedOf(pud) : '',
      head: head ? String(head.headWidth).trim() : '',
      pupaDate: pu.pupaDate || '', pupaW: pu.pupaWeight || '',
      adultDate: ec.date || '', adult: ec.totalLength || '',
    };
    for(let i = 0; i < 5; i++){
      const r = bottles[i] || {};
      v[`fd${i}`] = r.date || ''; v[`ff${i}`] = bottles[i] ? feedOf(r) : '';
      v[`fv${i}`] = ccOf(r.bottleSize); v[`fw${i}`] = r.weight || '';
    }
    Object.entries(v).forEach(([k, val]) => { if($(k)) $(k).value = String(val); });
    state.sex = sexOf(ind.sex);
    update();
    closeSheet();
    window.scrollTo({ top:0, behavior:'smooth' });
  }

  $('importBtn').addEventListener('click', startImport);
  $('sheetClose').addEventListener('click', closeSheet);
  sheetBg.addEventListener('click', closeSheet);
  $('sheetBack').addEventListener('click', () => { search.value = ''; showLines(); });
  search.addEventListener('input', () => view === 'lines' ? showLines() : showInds(curLine.id));
  $('logoutLink').addEventListener('click', e => {
    e.preventDefault(); setSession(null); bl = null; blEmail = ''; search.value = ''; startImport();
  });
  list.addEventListener('click', e => {
    const l = e.target.closest('[data-line]');
    if(l){ search.value = ''; showInds(l.dataset.line); list.scrollTop = 0; return; }
    const i = e.target.closest('[data-ind]');
    if(i){ const ind = (bl.individuals || []).find(x => x.id === i.dataset.ind); if(ind) fillFrom(ind); }
  });
  if(handleRedirect()) setTimeout(startImport, 0);

  load();
  tpl.onload = update;
  if(tpl.complete) update();
  document.fonts.ready.then(() => draw(collect()));
})();
</script>
</body>
</html>
